name: Update Radio Links

on:
  schedule:
    # Chạy tự động mỗi 6 tiếng (tính theo giờ UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Cho phép bấm nút "Run workflow" chạy thủ công bất cứ lúc nào

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update channels.json
        run: python update_links.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update radio stream links"
            git push
          fi
